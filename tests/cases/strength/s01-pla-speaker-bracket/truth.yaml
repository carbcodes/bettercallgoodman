verdict: not_safe
# Checker note: Kt = 1.66 (Peterson shoulder-fillet fit, L-corner as D/d = 2), PLA across-layer 30 MPa
# -> sigma_max = 48.8 MPa, SF = 0.62; agrees with the draft. Lever kept at 120 mm (conservative);
# measured to the corner's inside face it would be ~114 mm (M ~3360 N*mm, 5% lower).
values:
  moment_nmm: {value: 3532, tol: 0.05}
  max_stress_mpa: {value: 50, tol: 0.25}     # with Kt ~1.7; nominal is 29.4
  safety_factor: {value: 0.6, tol: 0.3}
must_mention: [layer_direction_strength]
why: |
  M = 29.43 N x 120 mm = 3532 N·mm. Z = b·h²/6 = 20·6²/6 = 120 mm³. sigma_nom = 29.4 MPa.
  Kt ~1.7 at a 1 mm fillet on a 6 mm section (r/d ~0.17) -> sigma_max ~50 MPa.
  The corner bends the vertical leg, whose layers are horizontal, so the load acts across layers:
  PLA across-layer tensile strength ~25-35 MPa -> SF ~0.6. Even ignoring Kt, SF ~1.0 < 2. Not safe.
  DRAFT: Carlos to confirm Kt (Peterson chart) and the PLA across-layer value with a source.
