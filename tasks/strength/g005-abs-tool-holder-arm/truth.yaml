verdict: not_safe
values:
  moment_nmm: {value: 2500, tol: 0.05}
  max_stress_mpa: {value: 23, tol: 0.2}
  safety_factor: {value: 1.29, tol: 0.25}
must_mention: [layer_direction_strength, stress_concentration]
why: |
  M = F·L = 29.43 N × 85 mm = 2502 N·mm.
  Z = b·h²/6 = 30·6²/6 = 180.0 mm³ → σ_nom = M/Z = 13.9 MPa.
  Root corner r/h = 1/6 = 0.167; corner into a much larger body taken as a shoulder with D/d = 2 (Peterson Chart 3.10 fit) → Kt = 1.66 → σ_max = 1.66·13.9 = 23.0 MPa.
  Strength: ABS across-layer strength 29.7 MPa (materials.yaml). SF = 29.7/23.0 = 1.29 vs required 2 → not safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
