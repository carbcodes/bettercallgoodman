verdict: safe
values:
  max_stress_mpa: {value: 89.5, tol: 0.05}
  static_safety_factor: {value: 5.92, tol: 0.05}
  fatigue_safety_factor: {value: 4.08, tol: 0.15}
why: |
  Z = π·d³/32 = π·16³/32 = 402.1 mm³; M_max = 450 × 80 = 36000 N·mm → σ_max = 89.5 MPa.
  Static SF = Sy/σ_max = 530/89.5 = 5.92.
  Load 0 → 450 N: σ_a = 44.8 MPa, σ_m = 44.8 MPa.
  Se' = 0.5·Sut = 315 MPa; ka (machined) = 4.51·630^-0.265 = 0.817; kb..ke ≈ 1 → Se = 257.4 MPa.
  Modified Goodman: 1/n = 44.8/257.4 + 44.8/630 = 0.245 → n_f = 4.08 (Gerber 5.02).
  SF = min(5.92, 4.08) = 4.08 vs required 2 → safe.
source: "Shigley 10th ed. Ch. 6 (Se' = 0.5 Sut, Marin surface factor Table 6-2, modified Goodman Eq. 6-41, Gerber Eq. 6-42); Steel Sy/Sut: Shigley 10th ed. Table A-20 (deterministic ASTM minimum strengths)"
