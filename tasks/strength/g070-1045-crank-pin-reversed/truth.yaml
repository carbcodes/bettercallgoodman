verdict: not_safe
values:
  max_stress_mpa: {value: 252, tol: 0.05}
  static_safety_factor: {value: 2.1, tol: 0.05}
  fatigue_safety_factor: {value: 1.02, tol: 0.15}
must_mention: [fatigue]
why: |
  Z = π·d³/32 = π·14³/32 = 269.4 mm³; M_max = 970 × 70 = 67900 N·mm → σ_max = 252.0 MPa.
  Static SF = Sy/σ_max = 530/252.0 = 2.10.
  Load -970 → 970 N: σ_a = 252.0 MPa, σ_m = 0.0 MPa.
  Se' = 0.5·Sut = 315 MPa; ka (machined) = 4.51·630^-0.265 = 0.817; kb..ke ≈ 1 → Se = 257.4 MPa.
  Modified Goodman: 1/n = 252.0/257.4 + 0.0/630 = 0.979 → n_f = 1.02 (Gerber 1.02).
  SF = min(2.10, 1.02) = 1.02 vs required 2 → not safe.
source: "Shigley 10th ed. Ch. 6 (Se' = 0.5 Sut, Marin surface factor Table 6-2, modified Goodman Eq. 6-41, Gerber Eq. 6-42); Steel Sy/Sut: Shigley 10th ed. Table A-20 (deterministic ASTM minimum strengths)"
