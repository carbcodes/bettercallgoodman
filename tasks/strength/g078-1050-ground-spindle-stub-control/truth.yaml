verdict: safe
values:
  max_stress_mpa: {value: 111, tol: 0.05}
  static_safety_factor: {value: 5.24, tol: 0.05}
  fatigue_safety_factor: {value: 3.89, tol: 0.15}
why: |
  Z = π·d³/32 = π·20³/32 = 785.4 mm³; M_max = 1450 × 60 = 87000 N·mm → σ_max = 110.8 MPa.
  Static SF = Sy/σ_max = 580/110.8 = 5.24.
  Load 0 → 1450 N: σ_a = 55.4 MPa, σ_m = 55.4 MPa.
  Se' = 0.5·Sut = 345 MPa; ka (ground) = 1.58·690^-0.085 = 0.906; kb..ke ≈ 1 → Se = 312.7 MPa.
  Modified Goodman: 1/n = 55.4/312.7 + 55.4/690 = 0.257 → n_f = 3.89 (Gerber 4.81).
  SF = min(5.24, 3.89) = 3.89 vs required 2 → safe.
source: "Shigley 10th ed. Ch. 6 (Se' = 0.5 Sut, Marin surface factor Table 6-2, modified Goodman Eq. 6-41, Gerber Eq. 6-42); Steel Sy/Sut: Shigley 10th ed. Table A-20 (deterministic ASTM minimum strengths)"
