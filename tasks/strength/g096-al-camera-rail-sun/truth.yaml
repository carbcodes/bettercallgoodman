verdict: not_safe
values:
  thermal_stress_mpa: {value: 48.8, tol: 0.05}
  thermal_force_n: {value: 3830, tol: 0.05}
  buckling_load_n: {value: 2090, tol: 0.05}
  safety_factor: {value: 0.545, tol: 0.1}
must_mention: [buckling]
why: |
  Fully restrained: σ = E·α·ΔT = 68900·2.36e-05·30 = 48.8 MPa → yield SF = 276/48.8 = 5.66.
  A = π·10²/4 = 78.5 mm² → axial force F = σ·A = 3831 N.
  I = π·10⁴/64 = 491 mm⁴; fixed-fixed → K = 0.5; KL/r = 160 vs transition 70 → Euler: P_cr = 2086 N.
  Buckling SF = 2086/3831 = 0.54; the rod would bow once ΔT > P_cr/(E·α·A) = 16.3 °C.
  SF = min(5.66, 0.54) = 0.54 vs required 1 → not OK.
source: "Shigley 10th ed. §3-14 (restrained thermal stress σ = EαΔT) and §4-11 to 4-13 (column buckling); CTE and E: ASM Aerospace Specification Metals / MatWeb (6061-T6 and 7075-T6 23.6e-6/°C, AISI 304 17.3e-6/°C, carbon steel ~12e-6/°C)"
