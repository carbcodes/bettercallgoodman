verdict: not_safe
values:
  buckling_load_n: {value: 1100, tol: 0.05}
  max_stress_mpa: {value: 29.8, tol: 0.05}
  safety_factor: {value: 0.735, tol: 0.1}
must_mention: [buckling]
why: |
  A = π·8²/4 = 50.3 mm²; σ = P/A = 1500/50.3 = 29.8 MPa → stress SF = 250/29.8 = 8.38.
  I = π·8⁴/64 = 201 mm⁴, r = d/4 = 2 mm; pinned-pinned → K = 1; KL/r = 300 vs transition √(2π²E/Sy) = 126 → Euler.
  P_cr = π²·E·I/(K·L)² = π²·200000·201/(1·600)² = 1102 N → buckling SF = 1102/1500 = 0.73.
  SF = min(8.38, 0.73) = 0.73 vs required 2 → not safe.
source: "Shigley 10th ed. §4-11 to 4-13 (Euler and Johnson columns, end-condition constants)"
