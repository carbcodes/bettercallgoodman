verdict: not_safe
values:
  thermal_stress_mpa: {value: 360, tol: 0.05}
  thermal_force_n: {value: 113097, tol: 0.05}
  buckling_load_n: {value: 77545, tol: 0.05}
  safety_factor: {value: 0.686, tol: 0.1}
why: |
  Fully restrained: σ = E·α·ΔT = 200000·1.2e-05·150 = 360.0 MPa → yield SF = 250/360.0 = 0.69.
  A = π·20²/4 = 314.2 mm² → axial force F = σ·A = 113097 N.
  I = π·20⁴/64 = 7854 mm⁴; fixed-fixed → K = 0.5; KL/r = 20 vs transition 126 → Johnson: P_cr = 77545 N.
  Buckling SF = 77545/113097 = 0.69; the rod would bow once ΔT > P_cr/(E·α·A) = 102.8 °C.
  SF = min(0.69, 0.69) = 0.69 vs required 1 → not OK.
source: "Shigley 10th ed. §3-14 (restrained thermal stress σ = EαΔT) and §4-11 to 4-13 (column buckling); CTE and E: ASM Aerospace Specification Metals / MatWeb (6061-T6 and 7075-T6 23.6e-6/°C, AISI 304 17.3e-6/°C, carbon steel ~12e-6/°C)"
