verdict: not_safe
values:
  moment_nmm: {value: 40388, tol: 0.05}
  max_stress_mpa: {value: 287, tol: 0.2}
  safety_factor: {value: 1.29, tol: 0.25}
why: |
  M = F·L = 222.4 N × 181.6 mm = 40388 N·mm.
  Z = b·h²/6 = 25.4·6.35²/6 = 170.7 mm³ → σ_nom = M/Z = 236.6 MPa.
  Root corner r/h = 3/6.35 = 0.472; corner into a much larger body taken as a shoulder with D/d = 2 (Peterson Chart 3.10 fit) → Kt = 1.21 → σ_max = 1.21·236.6 = 286.7 MPa.
  Strength: yield 370 MPa. SF = 370/286.7 = 1.29 vs required 2 → not safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
