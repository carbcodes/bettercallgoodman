verdict: not_safe
values:
  max_stress_mpa: {value: 239, tol: 0.05}
  static_safety_factor: {value: 1.55, tol: 0.05}
  fatigue_safety_factor: {value: 0.868, tol: 0.15}
must_mention: [fatigue]
why: |
  Z = π·d³/32 = π·8³/32 = 50.3 mm³; M_max = 300 × 40 = 12000 N·mm → σ_max = 238.7 MPa.
  Static SF = Sy/σ_max = 370/238.7 = 1.55.
  Load -300 → 300 N: σ_a = 238.7 MPa, σ_m = 0.0 MPa.
  Se' = 0.5·Sut = 220 MPa; ka (ground) = 1.58·440^-0.085 = 0.942; kb..ke ≈ 1 → Se = 207.2 MPa.
  Modified Goodman: 1/n = 238.7/207.2 + 0.0/440 = 1.152 → n_f = 0.87 (Gerber 0.87).
  SF = min(1.55, 0.87) = 0.87 vs required 1.5 → not safe.
source: "Shigley 10th ed. Ch. 6 (Se' = 0.5 Sut, Marin surface factor Table 6-2, modified Goodman Eq. 6-41, Gerber Eq. 6-42); Steel Sy/Sut: Shigley 10th ed. Table A-20 (deterministic ASTM minimum strengths)"
