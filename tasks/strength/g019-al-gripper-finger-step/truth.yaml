verdict: not_safe
values:
  moment_nmm: {value: 15000, tol: 0.05}
  max_stress_mpa: {value: 282, tol: 0.2}
  safety_factor: {value: 0.978, tol: 0.25}
must_mention: [stress_concentration]
why: |
  M = F·L = 100 N × 150 mm = 15000 N·mm.
  Z = b·h²/6 = 6·12²/6 = 144.0 mm³ → σ_nom = M/Z = 104.2 MPa.
  Shoulder step D/d = 20/12 = 1.67, r/d = 0.4/12 = 0.033 → Kt = 2.71 (Peterson Chart 3.10 fit, bending) → σ_max = 2.71·104.2 = 282.2 MPa.
  Strength: yield 276 MPa. SF = 276/282.2 = 0.98 vs required 2 → not safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
