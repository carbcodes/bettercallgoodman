verdict: not_safe
values:
  max_stress_mpa: {value: 229, tol: 0.05}
  static_safety_factor: {value: 1.61, tol: 0.05}
  fatigue_safety_factor: {value: 0.863, tol: 0.15}
must_mention: [fatigue]
why: |
  Z = π·d³/32 = π·10³/32 = 98.2 mm³; M_max = 375 × 60 = 22500 N·mm → σ_max = 229.2 MPa.
  Static SF = Sy/σ_max = 370/229.2 = 1.61.
  Load -375 → 375 N: σ_a = 229.2 MPa, σ_m = 0.0 MPa.
  Se' = 0.5·Sut = 220 MPa; ka (machined) = 4.51·440^-0.265 = 0.899; kb..ke ≈ 1 → Se = 197.7 MPa.
  Modified Goodman: 1/n = 229.2/197.7 + 0.0/440 = 1.159 → n_f = 0.86 (Gerber 0.86).
  SF = min(1.61, 0.86) = 0.86 vs required 1.5 → not safe.
source: "Shigley 10th ed. Ch. 6 (Se' = 0.5 Sut, Marin surface factor Table 6-2, modified Goodman Eq. 6-41, Gerber Eq. 6-42); Steel Sy/Sut: Shigley 10th ed. Table A-20 (deterministic ASTM minimum strengths)"
