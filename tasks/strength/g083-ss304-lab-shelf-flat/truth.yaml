verdict: not_safe
values:
  moment_nmm: {value: 29850, tol: 0.05}
  max_stress_mpa: {value: 179, tol: 0.05}
  safety_factor: {value: 1.2, tol: 0.05}
  deflection_mm: {value: 11.1, tol: 0.1}
why: |
  Simply supported, centre load: M = P·L/4 = 199·600/4 = 29850 N·mm.
  Bending depth is the dimension in the load direction, h = 5 mm (b = 40 mm): Z = b·h²/6 = 166.7 mm³, I = b·h³/12 = 416.7 mm⁴.
  σ = M/Z = 179.1 MPa → SF = 215/179.1 = 1.20 vs required 2.
  δ = P·L³/(48·E·I) = 199·600³/(48·193000·416.7) = 11.14 mm.
  → not safe (stress).
source: "Shigley 10th ed. Table A-9 case 5 (simply supported, centre load: M = PL/4, δ = PL³/48EI)"
