verdict: not_safe
values:
  moment_nmm: {value: 128025, tol: 0.05}
  max_stress_mpa: {value: 200, tol: 0.05}
  safety_factor: {value: 1.25, tol: 0.05}
  deflection_mm: {value: 16.9, tol: 0.1}
why: |
  Simply supported, centre load: M = P·L/4 = 569·900/4 = 128025 N·mm.
  Bending depth is the dimension in the load direction, h = 8 mm (b = 60 mm): Z = b·h²/6 = 640.0 mm³, I = b·h³/12 = 2560.0 mm⁴.
  σ = M/Z = 200.0 MPa → SF = 250/200.0 = 1.25 vs required 2.
  δ = P·L³/(48·E·I) = 569·900³/(48·200000·2560.0) = 16.88 mm.
  → not safe (stress).
source: "Shigley 10th ed. Table A-9 case 5 (simply supported, centre load: M = PL/4, δ = PL³/48EI)"
