verdict: not_safe
values:
  buckling_load_n: {value: 681, tol: 0.05}
  max_stress_mpa: {value: 9.55, tol: 0.05}
  safety_factor: {value: 0.908, tol: 0.1}
must_mention: [buckling]
why: |
  A = π·10²/4 = 78.5 mm²; σ = P/A = 750/78.5 = 9.5 MPa → stress SF = 276/9.5 = 28.90.
  I = π·10⁴/64 = 491 mm⁴, r = d/4 = 2.5 mm; pinned-pinned → K = 1; KL/r = 280 vs transition √(2π²E/Sy) = 70 → Euler.
  P_cr = π²·E·I/(K·L)² = π²·68900·491/(1·700)² = 681 N → buckling SF = 681/750 = 0.91.
  SF = min(28.90, 0.91) = 0.91 vs required 2 → not safe.
source: "Shigley 10th ed. §4-11 to 4-13 (Euler and Johnson columns, end-condition constants)"
