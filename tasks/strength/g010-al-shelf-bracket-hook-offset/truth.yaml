verdict: not_safe
values:
  moment_nmm: {value: 29440, tol: 0.05}
  max_stress_mpa: {value: 236, tol: 0.2}
  safety_factor: {value: 1.17, tol: 0.25}
why: |
  M = F·L = 147.2 N × 200 mm = 29440 N·mm.
  Z = b·h²/6 = 25·6²/6 = 150.0 mm³ → σ_nom = M/Z = 196.3 MPa.
  Root corner r/h = 3/6 = 0.500; corner into a much larger body taken as a shoulder with D/d = 2 (Peterson Chart 3.10 fit) → Kt = 1.20 → σ_max = 1.20·196.3 = 236.0 MPa.
  Strength: yield 276 MPa. SF = 276/236.0 = 1.17 vs required 2 → not safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
