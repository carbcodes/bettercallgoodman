verdict: safe
values:
  moment_nmm: {value: 628, tol: 0.05}
  max_stress_mpa: {value: 4.93, tol: 0.2}
  safety_factor: {value: 9.53, tol: 0.25}
why: |
  M = F·L = 7.85 N × 80 mm = 628 N·mm.
  Z = b·h²/6 = 15·8²/6 = 160.0 mm³ → σ_nom = M/Z = 3.9 MPa.
  Root corner r/h = 3/8 = 0.375; corner into a much larger body taken as a shoulder with D/d = 2 (Peterson Chart 3.10 fit) → Kt = 1.26 → σ_max = 1.26·3.9 = 4.9 MPa.
  Strength: PETG in-layer strength 47 MPa (materials.yaml). SF = 47/4.9 = 9.53 vs required 2 → safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
