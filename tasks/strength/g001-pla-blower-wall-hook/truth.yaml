verdict: not_safe
values:
  moment_nmm: {value: 2940, tol: 0.05}
  max_stress_mpa: {value: 23.6, tol: 0.2}
  safety_factor: {value: 1.27, tol: 0.25}
must_mention: [layer_direction_strength]
why: |
  M = F·L = 39.24 N × 75 mm = 2943 N·mm.
  Z = b·h²/6 = 25·6²/6 = 150.0 mm³ → σ_nom = M/Z = 19.6 MPa.
  Root corner r/h = 3/6 = 0.500; corner into a much larger body taken as a shoulder with D/d = 2 (Peterson Chart 3.10 fit) → Kt = 1.20 → σ_max = 1.20·19.6 = 23.6 MPa.
  Strength: PLA across-layer strength 30 MPa (materials.yaml). SF = 30/23.6 = 1.27 vs required 2 → not safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
