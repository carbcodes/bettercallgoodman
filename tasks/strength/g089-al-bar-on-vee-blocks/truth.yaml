verdict: not_safe
values:
  moment_nmm: {value: 132450, tol: 0.05}
  max_stress_mpa: {value: 221, tol: 0.05}
  safety_factor: {value: 1.25, tol: 0.05}
  deflection_mm: {value: 16, tol: 0.1}
why: |
  Simply supported, centre load: M = P·L/4 = 883·600/4 = 132450 N·mm.
  Bending depth is the dimension in the load direction, h = 12 mm (b = 25 mm): Z = b·h²/6 = 600.0 mm³, I = b·h³/12 = 3600.0 mm⁴.
  σ = M/Z = 220.8 MPa → SF = 276/220.8 = 1.25 vs required 2.
  δ = P·L³/(48·E·I) = 883·600³/(48·68900·3600.0) = 16.02 mm.
  → not safe (stress).
source: "Shigley 10th ed. Table A-9 case 5 (simply supported, centre load: M = PL/4, δ = PL³/48EI)"
