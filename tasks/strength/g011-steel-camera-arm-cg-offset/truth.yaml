verdict: not_safe
values:
  moment_nmm: {value: 15312, tol: 0.05}
  max_stress_mpa: {value: 153, tol: 0.2}
  safety_factor: {value: 1.63, tol: 0.25}
why: |
  M = F·L = 63.8 N × 240 mm = 15312 N·mm.
  Z = b·h²/6 = 20·6²/6 = 120.0 mm³ → σ_nom = M/Z = 127.6 MPa.
  Root corner r/h = 3/6 = 0.500; corner into a much larger body taken as a shoulder with D/d = 2 (Peterson Chart 3.10 fit) → Kt = 1.20 → σ_max = 1.20·127.6 = 153.4 MPa.
  Strength: yield 250 MPa. SF = 250/153.4 = 1.63 vs required 2.5 → not safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
