verdict: safe
values:
  moment_nmm: {value: 9820, tol: 0.05}
  max_stress_mpa: {value: 57.9, tol: 0.2}
  safety_factor: {value: 8.69, tol: 0.25}
why: |
  M = F·L = 49.1 N × 200 mm = 9820 N·mm.
  Z = b·h²/6 = 10·12²/6 = 240.0 mm³ → σ_nom = M/Z = 40.9 MPa.
  Shoulder step D/d = 20/12 = 1.67, r/d = 3/12 = 0.250 → Kt = 1.42 (Peterson Chart 3.10 fit, bending) → σ_max = 1.42·40.9 = 57.9 MPa.
  Strength: yield 503 MPa. SF = 503/57.9 = 8.69 vs required 1.5 → safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
