verdict: not_safe
values:
  moment_nmm: {value: 1500, tol: 0.05}
  max_stress_mpa: {value: 39.8, tol: 0.2}
  safety_factor: {value: 1.26, tol: 0.25}
must_mention: [stress_concentration]
why: |
  M = F·L = 30 N × 50 mm = 1500 N·mm.
  Z = b·h²/6 = 8·8²/6 = 85.3 mm³ → σ_nom = M/Z = 17.6 MPa.
  Shoulder step D/d = 16/8 = 2.00, r/d = 0.5/8 = 0.062 → Kt = 2.26 (Peterson Chart 3.10 fit, bending) → σ_max = 2.26·17.6 = 39.8 MPa.
  Strength: PLA in-layer strength 50 MPa (materials.yaml). SF = 50/39.8 = 1.26 vs required 2 → not safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
