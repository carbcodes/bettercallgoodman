verdict: not_safe
values:
  max_stress_mpa: {value: 229, tol: 0.05}
  static_safety_factor: {value: 1.61, tol: 0.05}
  fatigue_safety_factor: {value: 0.928, tol: 0.15}
must_mention: [fatigue]
why: |
  Z = π·d³/32 = π·18³/32 = 572.6 mm³; M_max = 1750 × 75 = 131250 N·mm → σ_max = 229.2 MPa.
  Static SF = Sy/σ_max = 370/229.2 = 1.61.
  Load 0 → 1750 N: σ_a = 114.6 MPa, σ_m = 114.6 MPa.
  Se' = 0.5·Sut = 220 MPa; ka (as forged) = 272·440^-0.995 = 0.637; kb..ke ≈ 1 → Se = 140.2 MPa.
  Modified Goodman: 1/n = 114.6/140.2 + 114.6/440 = 1.078 → n_f = 0.93 (Gerber 1.12).
  SF = min(1.61, 0.93) = 0.93 vs required 1.5 → not safe.
source: "Shigley 10th ed. Ch. 6 (Se' = 0.5 Sut, Marin surface factor Table 6-2, modified Goodman Eq. 6-41, Gerber Eq. 6-42); Steel Sy/Sut: Shigley 10th ed. Table A-20 (deterministic ASTM minimum strengths)"
