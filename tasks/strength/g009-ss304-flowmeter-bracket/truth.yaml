verdict: not_safe
values:
  moment_nmm: {value: 14712, tol: 0.05}
  max_stress_mpa: {value: 169, tol: 0.2}
  safety_factor: {value: 1.27, tol: 0.25}
must_mention: [stress_concentration]
why: |
  M = F·L = 117.7 N × 125 mm = 14712 N·mm.
  Z = b·h²/6 = 30·6²/6 = 180.0 mm³ → σ_nom = M/Z = 81.7 MPa.
  Root corner r/h = 0.5/6 = 0.083; corner into a much larger body taken as a shoulder with D/d = 2 (Peterson Chart 3.10 fit) → Kt = 2.07 → σ_max = 2.07·81.7 = 169.0 MPa.
  Strength: SS304 yield 215 MPa (materials.yaml). SF = 215/169.0 = 1.27 vs required 2 → not safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
