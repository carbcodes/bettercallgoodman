verdict: not_safe
values:
  max_stress_mpa: {value: 290, tol: 0.05}
  static_safety_factor: {value: 1.58, tol: 0.05}
  fatigue_safety_factor: {value: 0.875, tol: 0.15}
must_mention: [fatigue]
why: |
  Z = π·d³/32 = π·10³/32 = 98.2 mm³; M_max = 570 × 50 = 28500 N·mm → σ_max = 290.3 MPa.
  Static SF = Sy/σ_max = 460/290.3 = 1.58.
  Load -570 → 570 N: σ_a = 290.3 MPa, σ_m = 0.0 MPa.
  Se' = 0.5·Sut = 275 MPa; ka (ground) = 1.58·550^-0.085 = 0.924; kb..ke ≈ 1 → Se = 254.1 MPa.
  Modified Goodman: 1/n = 290.3/254.1 + 0.0/550 = 1.142 → n_f = 0.88 (Gerber 0.88).
  SF = min(1.58, 0.88) = 0.88 vs required 1.5 → not safe.
source: "Shigley 10th ed. Ch. 6 (Se' = 0.5 Sut, Marin surface factor Table 6-2, modified Goodman Eq. 6-41, Gerber Eq. 6-42); Steel Sy/Sut: Shigley 10th ed. Table A-20 (deterministic ASTM minimum strengths)"
