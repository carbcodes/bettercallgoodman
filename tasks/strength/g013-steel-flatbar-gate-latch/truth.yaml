verdict: not_safe
values:
  moment_nmm: {value: 80000, tol: 0.05}
  max_stress_mpa: {value: 546, tol: 0.2}
  safety_factor: {value: 0.458, tol: 0.25}
why: |
  M = F·L = 400 N × 200 mm = 80000 N·mm.
  Z = b·h²/6 = 40·5²/6 = 166.7 mm³ → σ_nom = M/Z = 480.0 MPa.
  Root corner r/h = 4/5 = 0.800; corner into a much larger body taken as a shoulder with D/d = 2 (Peterson Chart 3.10 fit) → Kt = 1.14 → σ_max = 1.14·480.0 = 546.2 MPa.
  Strength: yield 250 MPa. SF = 250/546.2 = 0.46 vs required 2 → not safe.
  Using the 40 mm width as the depth (on edge) would give Z = 5·40²/6 = 1333 mm³ and SF ≈ 3.7: that is not how the bar is mounted.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
