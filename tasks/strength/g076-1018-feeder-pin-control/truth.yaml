verdict: safe
values:
  max_stress_mpa: {value: 60.4, tol: 0.05}
  static_safety_factor: {value: 6.12, tol: 0.05}
  fatigue_safety_factor: {value: 3.27, tol: 0.15}
why: |
  Z = π·d³/32 = π·12³/32 = 169.6 mm³; M_max = 205 × 50 = 10250 N·mm → σ_max = 60.4 MPa.
  Static SF = Sy/σ_max = 370/60.4 = 6.12.
  Load -205 → 205 N: σ_a = 60.4 MPa, σ_m = 0.0 MPa.
  Se' = 0.5·Sut = 220 MPa; ka (machined) = 4.51·440^-0.265 = 0.899; kb..ke ≈ 1 → Se = 197.7 MPa.
  Modified Goodman: 1/n = 60.4/197.7 + 0.0/440 = 0.306 → n_f = 3.27 (Gerber 3.27).
  SF = min(6.12, 3.27) = 3.27 vs required 1.5 → safe.
source: "Shigley 10th ed. Ch. 6 (Se' = 0.5 Sut, Marin surface factor Table 6-2, modified Goodman Eq. 6-41, Gerber Eq. 6-42); Steel Sy/Sut: Shigley 10th ed. Table A-20 (deterministic ASTM minimum strengths)"
