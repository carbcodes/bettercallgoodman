verdict: not_safe
values:
  moment_nmm: {value: 108509, tol: 0.05}
  max_stress_mpa: {value: 410, tol: 0.2}
  safety_factor: {value: 0.903, tol: 0.25}
must_mention: [stress_concentration]
why: |
  M = F·L = 1068 N × 101.6 mm = 108509 N·mm.
  Z = b·h²/6 = 12.7·19.05²/6 = 768.1 mm³ → σ_nom = M/Z = 141.3 MPa.
  Shoulder step D/d = 31.75/19.05 = 1.67, r/d = 0.5/19.05 = 0.026 → Kt = 2.90 (Peterson Chart 3.10 fit, bending) → σ_max = 2.90·141.3 = 409.7 MPa.
  Strength: yield 370 MPa. SF = 370/409.7 = 0.90 vs required 2 → not safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
