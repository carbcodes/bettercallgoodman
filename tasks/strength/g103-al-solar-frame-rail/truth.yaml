verdict: not_safe
values:
  thermal_stress_mpa: {value: 56.9, tol: 0.05}
  thermal_force_n: {value: 6440, tol: 0.05}
  buckling_load_n: {value: 2770, tol: 0.05}
  safety_factor: {value: 0.43, tol: 0.1}
must_mention: [buckling]
why: |
  Fully restrained: σ = E·α·ΔT = 68900·2.36e-05·35 = 56.9 MPa → yield SF = 276/56.9 = 4.85.
  A = π·12²/4 = 113.1 mm² → axial force F = σ·A = 6437 N.
  I = π·12⁴/64 = 1018 mm⁴; fixed-fixed → K = 0.5; KL/r = 167 vs transition 70 → Euler: P_cr = 2769 N.
  Buckling SF = 2769/6437 = 0.43; the rod would bow once ΔT > P_cr/(E·α·A) = 15.1 °C.
  SF = min(4.85, 0.43) = 0.43 vs required 1 → not OK.
source: "Shigley 10th ed. §3-14 (restrained thermal stress σ = EαΔT) and §4-11 to 4-13 (column buckling); CTE and E: ASM Aerospace Specification Metals / MatWeb (6061-T6 and 7075-T6 23.6e-6/°C, AISI 304 17.3e-6/°C, carbon steel ~12e-6/°C)"
