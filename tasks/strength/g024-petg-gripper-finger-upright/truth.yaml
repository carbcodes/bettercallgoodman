verdict: not_safe
values:
  moment_nmm: {value: 2100, tol: 0.05}
  max_stress_mpa: {value: 14.4, tol: 0.2}
  safety_factor: {value: 1.25, tol: 0.25}
must_mention: [layer_direction_strength]
why: |
  M = F·L = 30 N × 70 mm = 2100 N·mm.
  Z = b·h²/6 = 12·10²/6 = 200.0 mm³ → σ_nom = M/Z = 10.5 MPa.
  Shoulder step D/d = 16/10 = 1.60, r/d = 3/10 = 0.300 → Kt = 1.37 (Peterson Chart 3.10 fit, bending) → σ_max = 1.37·10.5 = 14.4 MPa.
  Strength: PETG across-layer strength 18 MPa (materials.yaml). SF = 18/14.4 = 1.25 vs required 2 → not safe.
source: "Shigley 10th ed. §3-10 (bending stress); Kt: Pilkey & Pilkey, Peterson's Stress Concentration Factors 3rd ed., Chart 3.10 (stepped flat bar in bending, polynomial fit also in Roark 7th ed. Table 17.1)"
