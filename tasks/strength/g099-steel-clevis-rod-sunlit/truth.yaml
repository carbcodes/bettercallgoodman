verdict: not_safe
values:
  thermal_stress_mpa: {value: 60, tol: 0.05}
  thermal_force_n: {value: 4710, tol: 0.05}
  buckling_load_n: {value: 2690, tol: 0.05}
  safety_factor: {value: 0.571, tol: 0.1}
must_mention: [buckling]
why: |
  Fully restrained: σ = E·α·ΔT = 200000·1.2e-05·25 = 60.0 MPa → yield SF = 250/60.0 = 4.17.
  A = π·10²/4 = 78.5 mm² → axial force F = σ·A = 4712 N.
  I = π·10⁴/64 = 491 mm⁴; pinned-pinned → K = 1; KL/r = 240 vs transition 126 → Euler: P_cr = 2692 N.
  Buckling SF = 2692/4712 = 0.57; the rod would bow once ΔT > P_cr/(E·α·A) = 14.3 °C.
  SF = min(4.17, 0.57) = 0.57 vs required 1 → not OK.
source: "Shigley 10th ed. §3-14 (restrained thermal stress σ = EαΔT) and §4-11 to 4-13 (column buckling); CTE and E: ASM Aerospace Specification Metals / MatWeb (6061-T6 and 7075-T6 23.6e-6/°C, AISI 304 17.3e-6/°C, carbon steel ~12e-6/°C)"
